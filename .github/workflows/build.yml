name: Build - Sistema de Inventario

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxis del proyecto
        run: python -m compileall -q src

      - name: Ejecutar módulo Producto
        working-directory: src
        run: python Producto.py

      - name: Ejecutar módulo de búsqueda
        working-directory: src
        run: python busqueda.py
