
name: Liberacion del Sistema de Inventario

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Etiqueta de la version que se desea publicar'
        required: true
        type: string

permissions:
  contents: write

jobs:
  liberar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Crear paquete
        run: zip -r sistema-inventario-${{ inputs.tag_name || github.ref_name }}.zip src/

      - name: Publicar version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: sistema-inventario-${{ inputs.tag_name || github.ref_name }}.zip
          generate_release_notes: true
